{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-sync.fullname" . }}-leader-election-role
  namespace: {{ include "cert-sync.namespace" . }}
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-sync.fullname" . }}-manager-role
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-sync.fullname" . }}-metrics-auth-role
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-sync.fullname" . }}-metrics-reader
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-sync.fullname" . }}-leader-election-rolebinding
  namespace: {{ include "cert-sync.namespace" . }}
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-sync.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "cert-sync.serviceAccountName" . }}
  namespace: {{ include "cert-sync.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-sync.fullname" . }}-manager-rolebinding
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-sync.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "cert-sync.serviceAccountName" . }}
  namespace: {{ include "cert-sync.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-sync.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "cert-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-sync.fullname" . }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ include "cert-sync.serviceAccountName" . }}
  namespace: {{ include "cert-sync.namespace" . }}
{{- end }} 